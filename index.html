<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Natal - Lista de Presentes</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#9b1c14;color:#fff;font-family:Inter,Arial,sans-serif;text-align:center;padding:20px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:clamp(40px,12vw,64px);margin:10px 0;color:#2ecc40;text-shadow:3px 3px 0 #ccc;letter-spacing:2px}
  .sub{margin:0 0 10px;opacity:.9;font-size:18px}
  h2{color:#7dff7d;font-size:26px;margin:40px 0 10px}

  .card{display:flex;gap:14px;align-items:center;background:#fff;color:#111;border-radius:12px;
        padding:14px;margin:14px 0;text-align:left;box-shadow:0 2px 6px #0003}
  .foto{width:110px;height:110px;flex:none;display:flex;align-items:center;justify-content:center;
        background:#f2f2f2;border-radius:10px;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:contain}
  .emoji{font-size:48px}
  .info{flex:1}
  .nome{font-weight:700;font-size:16px}
  .desc{font-size:13px;color:#555;margin:4px 0}
  .preco{font-size:24px;font-weight:800;margin:4px 0 8px}
  .btn{display:inline-block;background:#1e9e3a;color:#fff;text-decoration:none;
       padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600}
  .btn:hover{background:#17802f}
  footer{margin:40px 0 10px;opacity:.8;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>FELIZ NATAL</h1>
  <p class="sub">pode escolher o presente que gostaria de me dar 🎁</p>
  <div id="lista"></div>
  <footer>🎄 Obrigado por pensar em mim!</footer>
</div>

  {faixa:50, nome:"Tokyo Ghoul Vol. 7", desc:"Mangá da Panini, capa mole.", preco:43.28, emoji:"📘", foto:"tokyo-ghoul-7.jpg",
   link:"https://www.mercadolivre.com.br/tokyo-ghoul-vol-7-ishida-sui-panini-capa-mole/p/MLB21798354?pdp_filters=item_id%3AMLB4391657147"},
  {faixa:50, nome:"Chainsaw Man Vol. 14", desc:"Mangá da Panini, capa mole.", preco:35.59, emoji:"📙", foto:"chainsaw-14.jpg",
   link:"https://www.mercadolivre.com.br/chainsaw-man-vol-14-fujimoto-tatsuki-panini-capa-mole/p/MLB30016691?pdp_filters=item_id%3AMLB3698760345"},
  {faixa:50, nome:"Óculos Juliet Lupa Mandrak 24k", desc:"Armação preta com lente roxa.", preco:39.00, emoji:"🕶️", foto:"oculos-juliet.jpg",
   link:"https://www.mercadolivre.com.br/oculos-juliet-lupa-mandrak-24k-mc-top-lente-roxo-cor-da-armacao/p/MLB27769088?pdp_filters=item_id%3AMLB7536097918"},

  // ---------- ATÉ R$ 100 ----------
  {faixa:100, nome:"Camiseta Regular Lettering Reckless", desc:"Algodão, cor branca, corte regular.", preco:79.90, emoji:"👕", foto:"camiseta-renner.jpg",

  // ---------- ATÉ R$ 1000 ----------

   link:"https://www.mercadolivre.com.br/relogio-casio-ae-1200whd-1-masculino-word-time-prata-quadrado-cor-da-correia-prateado/p/MLB18283866?pdp_filters=item_id%3AMLB2912757656"},

/* ====== CÓDIGO DO SITE (não precisa mexer) ====== */
const R = v => "R$ " + v.toFixed(2).replace(".", ",");

document.getElementById("lista").innerHTML = [50, 100, 1000].map(f => `
  <h2>até ${R(f)}</h2>
  ${PRODUTOS.filter(p => p.faixa === f).map(p => `
    <div class="card">
      <div class="foto">
        <img src="imagens/${p.foto}" alt="${p.nome}"
             onerror="this.outerHTML='<span class=emoji>${p.emoji}</span>'">
      </div>
      <div class="info">
        <div class="nome">${p.nome}</div>
        <div class="desc">${p.desc}</div>
       
        <a class="btn" href="${p.link}" target="_blank" rel="noopener noreferrer">Ver na loja →</a>
      </div>
    </div>`).join("")}
`).join("");
</script>
</body>
</html>
